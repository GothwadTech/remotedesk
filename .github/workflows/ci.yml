name: CI — File Size, Typecheck, Tests & Build

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run GothwadTech File Size Guard, Typecheck & Worker Tests
        run: npm test

      - name: Build Production Web Portal (Cloudflare Pages dist)
        run: npm run build
